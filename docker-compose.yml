version: '3.8'

services:
  # Base de Datos Relacional Principal
  postgres:
    image: postgres:15-alpine
    container_name: confytickets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-confy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confy_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-confytickets_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./documentation/03_base_de_datos/esquema_ddl_postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confy_admin} -d ${POSTGRES_DB:-confytickets_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Redis para Cache y Broker de Celery
  redis:
    image: redis:7-alpine
    container_name: confytickets-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interfaz gráfica web para administración de PostgreSQL (Adminer)
  adminer:
    image: adminer:latest
    container_name: confytickets-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
