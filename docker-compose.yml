services:
  # Base de Datos Relacional Principal (Puerto 5439 para evitar conflictos)
  postgres:
    image: postgres:15-alpine
    container_name: confytickets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-confy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confy_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-confytickets_db}
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./documentation/03_base_de_datos/esquema_ddl_postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confy_admin} -d ${POSTGRES_DB:-confytickets_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Redis para Cache y Broker de Celery (Puerto 6389)
  redis:
    image: redis:7-alpine
    container_name: confytickets-redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interfaz gráfica web para administración de PostgreSQL (Adminer en puerto 8085)
  adminer:
    image: adminer:latest
    container_name: confytickets-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - postgres

  # API Central FastAPI (Puerto 8088 en host -> 8000 en container)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: confytickets-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://confy_admin:confy_secure_password_2026@postgres:5432/confytickets_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: development
      DEBUG: "True"
      PROJECT_NAME: ConfyTickets
      API_V1_STR: /api/v1
    volumes:
      - ./backend:/app
    ports:
      - "8088:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
